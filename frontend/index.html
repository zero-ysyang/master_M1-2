<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data-Aware AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-content">
        <div class="header-title">
          <h1>📊 학습시간 트렌드 AI 비서</h1>
          <p>시계열 데이터를 기반으로 대화하는 AI 서비스</p> 
        </div>
        <button id="btn-theme-toggle" class="btn btn-sm secondary">🌙 다크 모드</button>
      </div>
    </header>

    <!-- 1. 데이터 요약 영역 -->
    <section class="card summary-card">
      <!-- 정렬을 위한 card-header 태그 구조 수정 -->
      <div class="card-header">
        <h2>📈 데이터 요약 정보</h2>
        <button id="btn-export-csv" class="btn btn-sm secondary">📥 CSV 다운로드</button>
      </div>

      <div id="summary-content" class="summary-grid">
        <div class="summary-item"><span class="label">기간:</span> <span id="sum-period">-</span></div>
        <div class="summary-item"><span class="label">건수:</span> <span id="sum-count">0</span>개</div>
        <div class="summary-item"><span class="label">평균값:</span> <span id="sum-avg">0</span></div>
        <div class="summary-item"><span class="label">최대/최소:</span> <span id="sum-range">0 / 0</span></div>
        <div class="summary-item full-width"><span class="label">최근 추세:</span> <span id="sum-trend" class="badge">-</span></div>
      </div>

      <!-- 추세 차트 캔버스 -->
      <div class="chart-container" style="position: relative; height:250px; margin-top:15px;">
        <canvas id="trendChart"></canvas>
      </div>
    </section>

    <div class="main-layout">
      <!-- 2. 좌측: 데이터 관리 및 대화 기록 -->
      <aside class="sidebar">
        <!-- 데이터 추가 폼 -->
        <section class="card">
          <h3>📝 데이터 추가</h3>
          <form id="data-form">
            <input type="date" id="input-date" required>
            <input type="number" step="0.1" id="input-value" placeholder="수치 (예: 5.5)" required>
            <input type="text" id="input-memo" placeholder="메모" required>
            <button type="submit" class="btn primary">추가하기</button>
          </form>
        </section>

        <!-- 데이터 목록 (CRUD 확인용) -->
        <section class="card">
          <h3>📋 데이터 목록 (최근 10건)</h3>
          <ul id="data-list" class="scrollable-list"></ul>
        </section>

        <!-- 이전 대화 기록 -->
        <section class="card">
          <h3>💬 대화 목록</h3>
          <button id="btn-new-chat" class="btn secondary btn-full">+ 새 대화 시작</button>
          <ul id="conv-list" class="scrollable-list"></ul>
        </section>
      </aside>

      <!-- 3. 우측: AI 채팅 영역 -->
      <main class="chat-section card">
        <div class="chat-header">
          <h3>🤖 AI 챗봇 대화</h3>
          <span id="current-conv-id" class="conv-id-badge">새 대화 모드</span>
        </div>
        
        <div id="chat-messages" class="chat-messages">
          <div class="message assistant">
            안녕하세요! 등록하신 데이터를 바탕으로 대화할 수 있습니다. "최근 트렌드 알려줘"라고 물어보세요!
          </div>
        </div>

        <div id="loading-spinner" class="loading-spinner hidden">
          <span>AI가 데이터를 분석하여 답변을 생성하는 중입니다...</span>
        </div>

        <form id="chat-form" class="chat-input-area">
          <input type="text" id="chat-input" placeholder="질문을 입력하세요..." required autocomplete="off">
          <button type="submit" class="btn primary">전송</button>
        </form>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
